# The PAYMENT ATTEMPT machine — a records programme (Vol. 09; the CoAgnes
# loader's subset: block YAML, records of the two registration kinds).
#
# Declared-record disambiguation (coagnes/CLAUDE.md §2):
# 1. Element: one attempt to pay one invoice, from the payer's choice of an
#    instrument to the mouth — screening, routing, authentication where the
#    screening asks for it, authorisation and capture at the acquirer, and
#    settlement. Fourteen knots and fourteen binds. Every comparison the
#    attempt needs — a threshold, a cheapest route, a fee — is made by a
#    pure function at the membrane (`screen@1`, `route@1`, `settle@1`; the
#    function host, Vol. 10 §9) or by the acquirer's stand-in
#    (`authorise@1`, `capture@1`), and the branching is declared `where`
#    rules over the answers' top-level marks (`band`, `challenge`,
#    `outcome`) — a knot's own condition is the null-guard subset (Vol. 05
#    §4.2), so no comparison is a knot's to make. Where the person or the
#    world must act — a reviewer's decision, the payer's authentication —
#    the machine waits with an open figure, and the door brings the fact.
#    One attempt is one session: an operator bind fires once per key
#    (Vol. 06 §4.2), so a retry is a new machine opened on the same invoice.
# 2. Server: this file, portal/nestvm/programmes/ — human-owned truth.
# 3. Consumer: the door sows these records at the birth of an attempt's
#    session, then commits `terms.given`, the invoice re-presented from the
#    order machine's publication, `session.Opened` and `instrument.Chosen`
#    in one wave; the wave log consumes the records themselves.
# 4. Successful inclusion: `src/walk.test.ts` — six stories: a frictionless
#    payment, a challenged one, one held for review and cleared, one
#    declined and retried on a new machine, one blocked, one whose capture
#    the acquirer refused; the log of each is byte-identical on a second
#    run (the deterministic class, Vol. 08 §5).
programme: payment-attempt
description: One attempt to pay one invoice, screened, routed, authorised, captured and settled; the person and the world act through the door.
records:
  # ── The attempt opens ──────────────────────────────────────────────────
  - kind: sys.knot.defined
    payload:
      id: attempt.opened
      strategy: deterministic
      config:
        meta:
          title: Attempt opened
          gloss: The invoice, the terms, the session and the instrument the payer chose.
        wind:
          collect:
            - as: invoice
              match_type: invoice.Issued
              reduce: latest
            - as: terms
              match_type: terms.given
              reduce: latest
            - as: session
              match_type: session.Opened
              reduce: latest
            - as: instrument
              match_type: instrument.Chosen
              reduce: latest
        condition: "invoice != null && terms != null && session != null && instrument != null"
  - kind: sys.descriptor.defined
    payload:
      id: attempt.screen
      meta:
        title: Screening
        gloss: The attempt scored under the terms by screen@1; the band and whether a challenge is due.
      operator:
        on: attempt.opened
        on_as: attempt
        service:
          instruction: screen@1
          schema:
            type: object
            properties:
              band:
                type: string
                enum:
                  - pass
                  - review
                  - block
              score:
                type: integer
                minimum: 0
                maximum: 100
              challenge:
                type: boolean
              reasons:
                type: array
            required:
              - band
              - score
              - challenge
              - reasons
          emit:
            writes: risk.Scored

  # ── Three bands, three declared rules ──────────────────────────────────
  - kind: sys.knot.defined
    payload:
      id: screen.passed
      strategy: deterministic
      config:
        meta:
          title: Passed screening
          gloss: The attempt may be routed.
        wind:
          collect:
            - as: screening
              match_type: risk.Scored
              reduce: latest
              where:
                - field: band
                  equals: pass
            - as: invoice
              match_type: invoice.Issued
              reduce: latest
            - as: terms
              match_type: terms.given
              reduce: latest
            - as: instrument
              match_type: instrument.Chosen
              reduce: latest
        condition: "screening != null && invoice != null && terms != null && instrument != null"
  - kind: sys.descriptor.defined
    payload:
      id: attempt.route
      meta:
        title: Routing
        gloss: The acquirer that carries the attempt, chosen by route@1 under the terms and the strategy in force.
      operator:
        on: screen.passed
        on_as: attempt
        service:
          instruction: route@1
          schema:
            type: object
            properties:
              acquirer:
                type: string
              strategy:
                type: string
              rule:
                type: string
              onUs:
                type: boolean
              expectedFeeMinor:
                type: integer
                minimum: 0
              alternatives:
                type: array
                minItems: 1
            required:
              - acquirer
              - strategy
              - rule
              - onUs
              - expectedFeeMinor
              - alternatives
          emit:
            writes: route.Chosen
  - kind: sys.knot.defined
    payload:
      id: screen.review
      strategy: deterministic
      config:
        meta:
          title: Held for review
          gloss: A compliance officer must decide.
        wind:
          collect:
            - as: screening
              match_type: risk.Scored
              reduce: latest
              where:
                - field: band
                  equals: review
        condition: "screening != null"
  - kind: sys.descriptor.defined
    payload:
      id: review.open
      subscribesTo: screen.review
      actionConfig:
        writes: review.Opened
  - kind: sys.knot.defined
    payload:
      id: screen.blocked
      strategy: deterministic
      config:
        meta:
          title: Blocked by screening
          gloss: The attempt ends here.
        wind:
          collect:
            - as: screening
              match_type: risk.Scored
              reduce: latest
              where:
                - field: band
                  equals: block
        condition: "screening != null"
  - kind: sys.descriptor.defined
    payload:
      id: screen.block
      subscribesTo: screen.blocked
      actionConfig:
        writes: attempt.Blocked

  # ── The reviewer's decision comes through the door ─────────────────────
  - kind: sys.knot.defined
    payload:
      id: review.cleared
      strategy: deterministic
      config:
        meta:
          title: Cleared by a person
          gloss: The reviewer let the attempt through; it may be routed.
        wind:
          collect:
            - as: cleared
              match_type: review.Cleared
              reduce: latest
            - as: screening
              match_type: risk.Scored
              reduce: latest
              where:
                - field: band
                  equals: review
            - as: invoice
              match_type: invoice.Issued
              reduce: latest
            - as: terms
              match_type: terms.given
              reduce: latest
            - as: instrument
              match_type: instrument.Chosen
              reduce: latest
        condition: "cleared != null && screening != null && invoice != null && terms != null && instrument != null"
  - kind: sys.descriptor.defined
    payload:
      id: attempt.route.cleared
      meta:
        title: Routing after review
        gloss: The same route@1, entered through the reviewer's door.
      operator:
        on: review.cleared
        on_as: attempt
        service:
          instruction: route@1
          schema:
            type: object
            properties:
              acquirer:
                type: string
              expectedFeeMinor:
                type: integer
                minimum: 0
            required:
              - acquirer
              - expectedFeeMinor
          emit:
            writes: route.Chosen
  - kind: sys.knot.defined
    payload:
      id: review.blocked
      strategy: deterministic
      config:
        meta:
          title: Blocked by a person
          gloss: The reviewer refused the attempt.
        wind:
          collect:
            - as: blocked
              match_type: review.Blocked
              reduce: latest
        condition: "blocked != null"
  - kind: sys.descriptor.defined
    payload:
      id: review.block
      subscribesTo: review.blocked
      actionConfig:
        writes: attempt.Blocked

  # ── Authentication where the screening asked for it ────────────────────
  - kind: sys.knot.defined
    payload:
      id: route.frictionless
      strategy: deterministic
      config:
        meta:
          title: Routed, no challenge
          gloss: The attempt goes straight to authorisation.
        wind:
          collect:
            - as: route
              match_type: route.Chosen
              reduce: latest
              where:
                - field: challenge
                  equals: false
            - as: invoice
              match_type: invoice.Issued
              reduce: latest
            - as: terms
              match_type: terms.given
              reduce: latest
            - as: instrument
              match_type: instrument.Chosen
              reduce: latest
        condition: "route != null && invoice != null && terms != null && instrument != null"
  - kind: sys.descriptor.defined
    payload:
      id: attempt.authorise
      meta:
        title: Authorisation
        gloss: The acquirer is asked to authorise the amount on the chosen route.
      operator:
        on: route.frictionless
        on_as: attempt
        service:
          instruction: authorise@1
          schema:
            type: object
            properties:
              outcome:
                type: string
                enum:
                  - approved
                  - declined
              acquirer:
                type: string
              reference:
                type: string
            required:
              - outcome
              - acquirer
              - reference
          emit:
            writes: authorisation.Answered
  - kind: sys.knot.defined
    payload:
      id: route.challenged
      strategy: deterministic
      config:
        meta:
          title: Routed, challenge due
          gloss: The payer must authenticate before the acquirer is asked.
        wind:
          collect:
            - as: route
              match_type: route.Chosen
              reduce: latest
              where:
                - field: challenge
                  equals: true
        condition: "route != null"
  - kind: sys.descriptor.defined
    payload:
      id: authentication.challenge
      subscribesTo: route.challenged
      actionConfig:
        writes: authentication.Challenged
  - kind: sys.knot.defined
    payload:
      id: authentication.passed
      strategy: deterministic
      config:
        meta:
          title: Authenticated
          gloss: The payer passed the challenge; the acquirer may be asked.
        wind:
          collect:
            - as: passed
              match_type: authentication.Passed
              reduce: latest
            - as: route
              match_type: route.Chosen
              reduce: latest
            - as: invoice
              match_type: invoice.Issued
              reduce: latest
            - as: terms
              match_type: terms.given
              reduce: latest
            - as: instrument
              match_type: instrument.Chosen
              reduce: latest
        condition: "passed != null && route != null && invoice != null && terms != null && instrument != null"
  - kind: sys.descriptor.defined
    payload:
      id: attempt.authorise.authenticated
      meta:
        title: Authorisation after authentication
        gloss: The same authorise@1, entered after the payer's challenge.
      operator:
        on: authentication.passed
        on_as: attempt
        service:
          instruction: authorise@1
          schema:
            type: object
            properties:
              outcome:
                type: string
                enum:
                  - approved
                  - declined
              acquirer:
                type: string
              reference:
                type: string
            required:
              - outcome
              - acquirer
              - reference
          emit:
            writes: authorisation.Answered
  - kind: sys.knot.defined
    payload:
      id: authentication.failed
      strategy: deterministic
      config:
        meta:
          title: Authentication failed
          gloss: The payer did not pass the challenge; the attempt ends.
        wind:
          collect:
            - as: failed
              match_type: authentication.Failed
              reduce: latest
        condition: "failed != null"
  - kind: sys.descriptor.defined
    payload:
      id: authentication.fail
      subscribesTo: authentication.failed
      actionConfig:
        writes: attempt.Failed

  # ── The acquirer's answer, capture and the mouth ───────────────────────
  - kind: sys.knot.defined
    payload:
      id: authorisation.approved
      strategy: deterministic
      config:
        meta:
          title: Authorised
          gloss: The money is secured; the capture may be asked for.
        wind:
          collect:
            - as: authorisation
              match_type: authorisation.Answered
              reduce: latest
              where:
                - field: outcome
                  equals: approved
            - as: route
              match_type: route.Chosen
              reduce: latest
            - as: invoice
              match_type: invoice.Issued
              reduce: latest
            - as: terms
              match_type: terms.given
              reduce: latest
            - as: instrument
              match_type: instrument.Chosen
              reduce: latest
        condition: "authorisation != null && route != null && invoice != null && terms != null && instrument != null"
  - kind: sys.descriptor.defined
    payload:
      id: attempt.capture
      meta:
        title: Capture
        gloss: The acquirer is asked to capture the authorised amount.
      operator:
        on: authorisation.approved
        on_as: attempt
        service:
          instruction: capture@1
          schema:
            type: object
            properties:
              outcome:
                type: string
                enum:
                  - captured
                  - failed
              capturedMinor:
                type: integer
                minimum: 0
              reference:
                type: string
            required:
              - outcome
              - capturedMinor
              - reference
          emit:
            writes: capture.Answered
  - kind: sys.knot.defined
    payload:
      id: authorisation.declined
      strategy: deterministic
      config:
        meta:
          title: Declined
          gloss: The acquirer declined; the attempt ends and the invoice stays open.
        wind:
          collect:
            - as: authorisation
              match_type: authorisation.Answered
              reduce: latest
              where:
                - field: outcome
                  equals: declined
        condition: "authorisation != null"
  - kind: sys.descriptor.defined
    payload:
      id: authorisation.decline
      subscribesTo: authorisation.declined
      actionConfig:
        writes: attempt.Declined
  - kind: sys.knot.defined
    payload:
      id: capture.completed
      strategy: deterministic
      config:
        meta:
          title: Captured
          gloss: The money moved; the mouth settles the attempt.
        wind:
          collect:
            - as: capture
              match_type: capture.Answered
              reduce: latest
              where:
                - field: outcome
                  equals: captured
            - as: route
              match_type: route.Chosen
              reduce: latest
            - as: invoice
              match_type: invoice.Issued
              reduce: latest
            - as: terms
              match_type: terms.given
              reduce: latest
        condition: "capture != null && route != null && invoice != null && terms != null"
  - kind: sys.descriptor.defined
    payload:
      id: attempt.settle
      meta:
        title: Settlement
        gloss: The fee under the terms, the balanced postings and the receipt, computed by settle@1.
      operator:
        on: capture.completed
        on_as: attempt
        service:
          instruction: settle@1
          schema:
            type: object
            properties:
              paymentId:
                type: string
              amountMinor:
                type: integer
                minimum: 1
              feeMinor:
                type: integer
                minimum: 0
              netMinor:
                type: integer
                minimum: 0
              postings:
                type: array
                minItems: 2
            required:
              - paymentId
              - amountMinor
              - feeMinor
              - netMinor
              - postings
          emit:
            writes: attempt.Settled
  - kind: sys.knot.defined
    payload:
      id: capture.failed
      strategy: deterministic
      config:
        meta:
          title: Capture failed
          gloss: The acquirer could not capture; the attempt ends with the authorisation to be released.
        wind:
          collect:
            - as: capture
              match_type: capture.Answered
              reduce: latest
              where:
                - field: outcome
                  equals: failed
        condition: "capture != null"
  - kind: sys.descriptor.defined
    payload:
      id: capture.fail
      subscribesTo: capture.failed
      actionConfig:
        writes: attempt.Failed
